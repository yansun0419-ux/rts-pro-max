<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UF Transit Optimizer (v2)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for in-browser JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- TensorFlow.js for simple NN scoring (can be swapped for backend model later) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.21.0/dist/tf.min.js"></script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // --------- Utilities ---------
      const uid = () => Math.random().toString(36).slice(2, 10);

      const load = (key, fallback) => {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback } catch { return fallback }
      };
      const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} };

      const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

      // --------- Seed data (plans, ratings, experiences) ---------
      const seedPlans = [
        {
          id: uid(),
          title: "Reitz → Butler Plaza (morning)",
          origin: "Reitz Union",
          destination: "Butler Plaza",
          days: ["Mon","Tue","Wed","Thu","Fri"],
          departWindow: "08:00-09:30",
          legs: [
            { route: "34", from: "Reitz Union", to: "Butler Plaza Transfer", notes: "~10-12 min headway at peak" },
          ],
          author: "demo@ufl.edu",
          createdAt: Date.now() - 1000*60*60*24*3
        },
        {
          id: uid(),
          title: "Broward → New Engineering Bldg (class rush)",
          origin: "Broward Hall",
          destination: "New Engineering Building",
          days: ["Mon","Wed","Fri"],
          departWindow: "10:10-10:40",
          legs: [
            { route: "9", from: "Broward Area", to: "Hub", notes: "Short hop; walk 5-7 min" },
          ],
          author: "alex@ufl.edu",
          createdAt: Date.now() - 1000*60*60*24*2
        },
        {
          id: uid(),
          title: "Shands → Newell (afternoon labs)",
          origin: "UF Health Shands",
          destination: "Newell Hall",
          days: ["Tue","Thu"],
          departWindow: "15:00-16:30",
          legs: [
            { route: "20", from: "Shands", to: "Tigert / Newell", notes: "Often crowded; try front car" },
          ],
          author: "maya@ufl.edu",
          createdAt: Date.now() - 1000*60*60*36
        },
      ];

      const seedRatings = [
        { id: uid(), planId: seedPlans[0].id, rating: 5, comment: "Consistent timing.", user: "u1", createdAt: Date.now()-1000*60*60*10 },
        { id: uid(), planId: seedPlans[0].id, rating: 4, comment: "Crowded on Fri.", user: "u2", createdAt: Date.now()-1000*60*60*9 },
        { id: uid(), planId: seedPlans[1].id, rating: 3, comment: "OK but tight transfer.", user: "u3", createdAt: Date.now()-1000*60*60*5 },
        { id: uid(), planId: seedPlans[2].id, rating: 5, comment: "Great for labs.", user: "u4", createdAt: Date.now()-1000*60*60*8 },
      ];

      // Each experience is a single real-world trip log tied to a plan
      // Fields: waitMin, onboardMin, crowd(1-5), onTime(true/false), rating(1-5), comment
      const seedExperiences = [
        { id: uid(), planId: seedPlans[0].id, waitMin: 8,  onboardMin: 14, crowd: 4, onTime: true,  rating: 5, comment: "Smooth ride", user:"u1", createdAt: Date.now()-1000*60*60*24 },
        { id: uid(), planId: seedPlans[0].id, waitMin: 12, onboardMin: 16, crowd: 5, onTime: true,  rating: 4, comment: "Full bus",    user:"u2", createdAt: Date.now()-1000*60*60*20 },
        { id: uid(), planId: seedPlans[1].id, waitMin: 9,  onboardMin: 6,  crowd: 3, onTime: false, rating: 3, comment: "Tight xfer",  user:"u3", createdAt: Date.now()-1000*60*60*15 },
        { id: uid(), planId: seedPlans[2].id, waitMin: 6,  onboardMin: 12, crowd: 2, onTime: true,  rating: 5, comment: "Perfect",    user:"u4", createdAt: Date.now()-1000*60*60*12 },
      ];

      function ensureSeed() {
        const has = load("ufx_plans", null);
        if (!has || !Array.isArray(has) || has.length === 0) save("ufx_plans", seedPlans);
        const rs = load("ufx_ratings", null);
        if (!rs || !Array.isArray(rs) || rs.length === 0) save("ufx_ratings", seedRatings);
        const ex = load("ufx_exps", null);
        if (!ex || !Array.isArray(ex) || ex.length === 0) save("ufx_exps", seedExperiences);
      }

      // Simple string similarity (bag-of-words overlap)
      function textSim(a, b) {
        const A = new Set((a||"").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean));
        const B = new Set((b||"").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean));
        if (!A.size || !B.size) return 0;
        let inter = 0; A.forEach(x => { if (B.has(x)) inter++; });
        return inter / Math.max(A.size, B.size);
      }

      // Bayesian smoothed score
      function bayesScore(ratings) {
        const n = ratings.length; if (!n) return 0;
        const sum = ratings.reduce((s,r)=>s+r.rating,0);
        const prior = 3.8; const weight = 2;
        return (sum + prior*weight) / (n + weight);
      }

      // Parse HH:MM-HH:MM, return start hour (0-23)
      function parseStartHour(win) {
        const m = /^(\d{2}):(\d{2})\s*-\s*(\d{2}):(\d{2})$/.exec((win||"").trim());
        if (!m) return 8; // default
        return parseInt(m[1],10);
      }

      // Aggregate stats per plan from experiences
      function planStats(planId, exps) {
        const xs = exps.filter(e=>e.planId===planId);
        const n = xs.length;
        if (!n) return { n:0, avgWait:0, avgCrowd:0, onTimeRate:0, avgOnboard:0 };
        const avgWait = xs.reduce((s,e)=>s+e.waitMin,0)/n;
        const avgCrowd = xs.reduce((s,e)=>s+e.crowd,0)/n;
        const avgOnboard = xs.reduce((s,e)=>s+e.onboardMin,0)/n;
        const onTimeRate = xs.reduce((s,e)=>s+(e.onTime?1:0),0)/n;
        return { n, avgWait, avgCrowd, onTimeRate, avgOnboard };
      }

      // Compute features for a plan used by the ML scorer
      function planFeatures(plan, exps) {
        const s = planStats(plan.id, exps);
        const h = parseStartHour(plan.departWindow);
        // Normalize features to 0..1 ranges
        const f = {
          avgWaitN: clamp(s.avgWait/30, 0, 1),
          avgCrowdN: clamp(s.avgCrowd/5, 0, 1),
          onTimeN: clamp(s.onTimeRate, 0, 1),
          hourN: clamp(h/23, 0, 1),
          avgOnboardN: clamp(s.avgOnboard/40, 0, 1),
          samplesN: clamp(Math.log10(1+s.n)/2, 0, 1),
        };
        return f;
      }

      // --------- Data hook ---------
      function useData() {
        const [plans, setPlans] = useState(load("ufx_plans", []));
        const [ratings, setRatings] = useState(load("ufx_ratings", []));
        const [exps, setExps] = useState(load("ufx_exps", []));

        useEffect(()=>{ ensureSeed(); setPlans(load("ufx_plans", [])); setRatings(load("ufx_ratings", [])); setExps(load("ufx_exps", [])); }, []);
        useEffect(()=>{ save("ufx_plans", plans); }, [plans]);
        useEffect(()=>{ save("ufx_ratings", ratings); }, [ratings]);
        useEffect(()=>{ save("ufx_exps", exps); }, [exps]);

        const addPlan = (p) => setPlans(prev => [{...p, id: uid(), createdAt: Date.now()}, ...prev]);
        const addRating = (r) => setRatings(prev => [{...r, id: uid(), createdAt: Date.now()}, ...prev]);
        const addExp = (e) => setExps(prev => [{...e, id: uid(), createdAt: Date.now()}, ...prev]);

        return { plans, ratings, exps, addPlan, addRating, addExp };
      }

      // --------- ML Model (tiny NN with tfjs, optional) ---------
      async function trainTinyModel(exps) {
        if (!window.tf) throw new Error("TensorFlow.js not loaded");
        if (!exps || exps.length < 3) throw new Error("Not enough experiences to train");

        // Build training dataset from experiences
        const X = [];
        const y = [];
        for (const e of exps) {
          const f = {
            avgWaitN: clamp(e.waitMin/30, 0, 1),
            avgCrowdN: clamp(e.crowd/5, 0, 1),
            onTimeN: e.onTime ? 1 : 0,
            hourN: 0.5, // unknown per experience; will rely on plan-level for inference
            avgOnboardN: clamp(e.onboardMin/40, 0, 1),
            samplesN: 0.2,
          };
          X.push([f.avgWaitN, f.avgCrowdN, f.onTimeN, f.hourN, f.avgOnboardN, f.samplesN]);
          y.push([clamp((e.rating||3)/5, 0, 1)]);
        }

        const xs = tf.tensor2d(X);
        const ys = tf.tensor2d(y);

        const model = tf.sequential();
        model.add(tf.layers.dense({ units: 8, inputShape:[6], activation:'relu' }));
        model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
        model.compile({ optimizer: tf.train.adam(0.05), loss: 'meanSquaredError' });

        await model.fit(xs, ys, { epochs: 60, batchSize: 8, shuffle: true, verbose: 0 });
        await model.save('localstorage://ufx_model');
        xs.dispose(); ys.dispose();
        return model;
      }

      async function loadModel() {
        if (!window.tf) return null;
        try { return await tf.loadLayersModel('localstorage://ufx_model'); } catch { return null; }
      }

      async function scoreWithModel(model, f) {
        if (!model) return null;
        const x = tf.tensor2d([[f.avgWaitN, f.avgCrowdN, f.onTimeN, f.hourN, f.avgOnboardN, f.samplesN]]);
        const out = model.predict(x);
        const v = (await out.data())[0];
        x.dispose(); out.dispose();
        return v; // 0..1 predicted satisfaction
      }

      // --------- UI Components ---------
      const Chip = ({children}) => (
        <span className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 text-xs border border-slate-200">{children}</span>
      );

      function Stars({ value=0, onChange, size="text-xl" }) {
        const [hover, setHover] = useState(0);
        const stars = [1,2,3,4,5];
        return (
          <div className="flex items-center gap-1">
            {stars.map(n => (
              <button
                key={n}
                type="button"
                onMouseEnter={()=>setHover(n)}
                onMouseLeave={()=>setHover(0)}
                onClick={()=>onChange && onChange(n)}
                className={size}
                aria-label={`rate ${n}`}
              >{(hover||value) >= n ? "★" : "☆"}</button>
            ))}
          </div>
        );
      }

      function Stat({label, value, hint}) {
        return (
          <div className="px-3 py-2 rounded-xl bg-slate-50 border text-sm">
            <div className="text-slate-500">{label}</div>
            <div className="font-semibold">{value}</div>
            {hint && <div className="text-xs text-slate-400">{hint}</div>}
          </div>
        );
      }

      function PlanCard({ plan, ratings, exps, onRate }) {
        const rts = ratings.filter(r=>r.planId===plan.id);
        const avg = rts.length ? (rts.reduce((s,r)=>s+r.rating,0)/rts.length) : 0;
        const score = bayesScore(rts);
        const st = planStats(plan.id, exps);

        return (
          <div className="rounded-2xl p-4 shadow-sm border bg-white flex flex-col gap-3">
            <div className="flex items-start justify-between">
              <div>
                <h3 className="text-lg font-semibold">{plan.title}</h3>
                <p className="text-sm text-slate-600">{plan.origin} → {plan.destination}</p>
              </div>
              <div className="text-right">
                <div className="text-sm">⭐ {avg.toFixed(2)} <span className="text-slate-400">({rts.length})</span></div>
                <div className="text-[11px] text-slate-400">Confidence: {score.toFixed(2)}</div>
              </div>
            </div>
            <div className="flex flex-wrap gap-2">
              <Chip>{plan.departWindow}</Chip>
              <Chip>{plan.days.join(" • ")}</Chip>
              <Chip>by {plan.author}</Chip>
            </div>
            <ol className="list-decimal pl-6 text-sm text-slate-700">
              {plan.legs.map((l, i)=> (
                <li key={i} className="mb-1"><span className="font-medium">{l.route ? `Route ${l.route}` : "Leg"}</span>: {l.from} → {l.to} {l.notes ? <span className="text-slate-500">· {l.notes}</span> : null}</li>
              ))}
            </ol>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <Stat label="Avg wait" value={`${st.n?st.avgWait.toFixed(1):'-'} min`} hint={`${st.n} logs`} />
              <Stat label="On-time" value={`${st.n?(st.onTimeRate*100).toFixed(0):'-'}%`} />
              <Stat label="Crowding" value={`${st.n?st.avgCrowd.toFixed(1):'-'}/5`} />
              <Stat label="Ride time" value={`${st.n?st.avgOnboard.toFixed(1):'-'} min`} />
            </div>

            <div className="flex items-center gap-3">
              <Stars onChange={(n)=> onRate && onRate(n)} />
              <span className="text-xs text-slate-500">Quick rate</span>
            </div>
          </div>
        );
      }

      function DaysPicker({ value, onChange }) {
        const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
        const toggle = (d) => {
          const has = value.includes(d);
          const next = has ? value.filter(x=>x!==d) : [...value, d];
          onChange(next);
        };
        return (
          <div className="flex flex-wrap gap-1.5 items-center">
            {days.map(d => (
              <button key={d} type="button" onClick={()=>toggle(d)} className={`px-2.5 py-1 rounded-xl border text-sm ${value.includes(d)?"bg-slate-900 text-white border-slate-900":"bg-white hover:bg-slate-50"}`}>{d}</button>
            ))}
          </div>
        );
      }

      function ExperienceForm({ plans, onSubmit }) {
        const [planId, setPlanId] = useState(plans[0]?.id || "");
        const [waitMin, setWaitMin] = useState(8);
        const [onboardMin, setOnboardMin] = useState(12);
        const [crowd, setCrowd] = useState(3);
        const [onTime, setOnTime] = useState(true);
        const [rating, setRating] = useState(4);
        const [comment, setComment] = useState("");

        const submit = (e) => {
          e.preventDefault();
          if (!planId) return alert("Select a plan");
          onSubmit({ planId, waitMin:Number(waitMin)||0, onboardMin:Number(onboardMin)||0, crowd:Number(crowd)||3, onTime:!!onTime, rating:Number(rating)||3, comment, user:"you" });
          setComment("");
        };

        return (
          <form onSubmit={submit} className="rounded-2xl p-4 border bg-white space-y-4">
            <div className="grid md:grid-cols-3 gap-3">
              <select className="px-3 py-2 rounded-xl border" value={planId} onChange={e=>setPlanId(e.target.value)}>
                {plans.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
              </select>
              <div className="grid grid-cols-2 gap-2">
                <input className="px-3 py-2 rounded-xl border" type="number" min="0" placeholder="Wait (min)" value={waitMin} onChange={e=>setWaitMin(e.target.value)} />
                <input className="px-3 py-2 rounded-xl border" type="number" min="0" placeholder="Ride (min)" value={onboardMin} onChange={e=>setOnboardMin(e.target.value)} />
              </div>
              <div className="grid grid-cols-2 gap-2 items-center">
                <div className="flex items-center gap-2">
                  <span className="text-sm text-slate-600">Crowd</span>
                  <input className="px-3 py-2 rounded-xl border w-20" type="number" min="1" max="5" value={crowd} onChange={e=>setCrowd(e.target.value)} />
                </div>
                <label className="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" checked={onTime} onChange={e=>setOnTime(e.target.checked)} /> On time</label>
              </div>
            </div>

            <div className="grid md:grid-cols-3 gap-3 items-center">
              <div className="flex items-center gap-3"><span className="text-sm text-slate-600">Your rating</span> <Stars value={rating} onChange={setRating} /></div>
              <input className="px-3 py-2 rounded-xl border md:col-span-2" placeholder="Comment (optional)" value={comment} onChange={e=>setComment(e.target.value)} />
            </div>

            <div className="flex justify-end">
              <button type="submit" className="px-4 py-2 rounded-xl bg-slate-900 text-white">Log experience</button>
            </div>

            <p className="text-xs text-slate-500">We record your trip locally in your browser for this MVP. In production, this would be anonymized and stored securely.</p>
          </form>
        );
      }

      function InsightCard({ plan, exps }) {
        const s = planStats(plan.id, exps);
        if (!s.n) return null;
        const msgs = [];
        if (s.avgWait > 12) msgs.push(`Avg wait ${s.avgWait.toFixed(1)} min (>12).`);
        if (s.onTimeRate < 0.85) msgs.push(`On-time ${(s.onTimeRate*100).toFixed(0)}% (<85%).`);
        if (s.avgCrowd >= 4) msgs.push(`Crowding high (${s.avgCrowd.toFixed(1)}/5).`);
        if (msgs.length===0) return null;

        // Simple operational suggestion
        const h = parseStartHour(plan.departWindow);
        const windowLabel = `${plan.departWindow}`;
        let rec = `Consider +1 bus (or shorter headway) around ${windowLabel}.`;
        if (s.avgCrowd >= 4 && s.avgWait <= 10) rec = `Crowding is primary; consider larger vehicle or staggered departures in ${windowLabel}.`;

        return (
          <div className="rounded-xl p-3 border bg-amber-50 border-amber-200 text-amber-900 text-sm">
            <div className="font-semibold">{plan.title}</div>
            <div className="">{msgs.join(" ")}</div>
            <div className="text-amber-800 mt-1">Suggestion: {rec}</div>
          </div>
        );
      }

      // --------- App ---------
      function App() {
        const { plans, ratings, exps, addPlan, addRating, addExp } = useData();
        const [tab, setTab] = useState("explore");

        // Search / Recommend controls
        const [qOrigin, setQOrigin] = useState("");
        const [qDest, setQDest] = useState("");
        const [qTime, setQTime] = useState(""); // optional HH:MM-HH:MM

        // New plan form state
        const [form, setForm] = useState({
          title: "",
          origin: "",
          destination: "",
          days: [],
          departWindow: "08:00-09:00",
          legs: [{ route: "", from: "", to: "", notes: "" }],
          author: "you@ufl.edu"
        });

        // ML model state
        const [model, setModel] = useState(null);
        const [training, setTraining] = useState(false);
        const [modelMsg, setModelMsg] = useState("");

        useEffect(()=>{ (async()=>{ const m = await loadModel(); if (m) setModel(m); })(); }, []);

        const filtered = useMemo(()=>{
          const scored = plans.map(p => {
            const s1 = textSim(qOrigin, p.origin);
            const s2 = textSim(qDest, p.destination);
            const tBoost = qTime && p.departWindow.includes(qTime.split("-")[0].slice(0,2)) ? 0.1 : 0;
            const rs = ratings.filter(r=>r.planId===p.id);
            const conf = bayesScore(rs);

            // ML contribution
            const f = planFeatures(p, exps);
            let ml = 0; // default heuristic when model missing
            if (model) {
              // NOTE: synchronous use isn't possible; so we'll approximate with heuristic here and
              // show exact ML scores in the Analytics tab. For ranking we mix heuristic now.
              ml = (1 - f.avgWaitN)*0.5 + f.onTimeN*0.3 + (1 - f.avgCrowdN)*0.2; // 0..1
            } else {
              ml = (1 - f.avgWaitN)*0.5 + f.onTimeN*0.3 + (1 - f.avgCrowdN)*0.2; // same heuristic before model is trained
            }

            const composite = (s1 + s2)/2 + conf/10 + tBoost + ml*0.4; // blend heuristic/ML
            return {p, rs, conf, composite};
          });
          return scored.sort((a,b)=> b.composite - a.composite);
        }, [plans, ratings, exps, qOrigin, qDest, qTime, model]);

        const myPlans = useMemo(()=> plans.filter(p => p.author === "you@ufl.edu"), [plans]);

        const handleAddLeg = () => setForm(f => ({...f, legs: [...f.legs, { route: "", from: "", to: "", notes: "" }]}));
        const handleRemoveLeg = (idx) => setForm(f => ({...f, legs: f.legs.filter((_,i)=>i!==idx)}));

        const submitPlan = (e) => {
          e.preventDefault();
          const cleanLegs = form.legs.filter(l => l.from && l.to);
          if (!form.title || !form.origin || !form.destination || cleanLegs.length===0) return alert("Please fill title, origin, destination, and at least one leg.");
          const plan = { id: "", title: form.title.trim(), origin: form.origin.trim(), destination: form.destination.trim(), days: form.days, departWindow: form.departWindow, legs: cleanLegs, author: form.author.trim(), createdAt: Date.now() };
          addPlan(plan);
          setForm({ title: "", origin: "", destination: "", days: [], departWindow: "08:00-09:00", legs: [{ route: "", from: "", to: "", notes: "" }], author: form.author });
          setTab("explore");
        };

        const onRate = (planId, n) => {
          addRating({ id: "", planId, rating: n, comment: "", user: "anon", createdAt: Date.now() });
        };

        const onLogExp = (e) => {
          addExp(e);
          addRating({ id: "", planId: e.planId, rating: e.rating, comment: e.comment||"", user: e.user||"you", createdAt: Date.now() });
        };

        const doTrain = async () => {
          setTraining(true); setModelMsg("");
          try {
            const m = await trainTinyModel(exps);
            setModel(m);
            setModelMsg(`Model trained on ${exps.length} experiences and saved to localStorage.`);
          } catch (err) {
            setModelMsg(err.message || String(err));
          } finally {
            setTraining(false);
          }
        };

        return (
          <div className="min-h-screen bg-slate-50">
            <header className="sticky top-0 z-10 bg-white/90 backdrop-blur border-b">
              <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-2xl bg-slate-900 text-white grid place-items-center text-sm">UF</div>
                  <div>
                    <h1 className="font-bold leading-tight">UF Transit Optimizer</h1>
                    <p className="text-xs text-slate-500 -mt-0.5">Crowd-sourced trip logs + ratings + ML scoring</p>
                  </div>
                </div>
                <nav className="flex flex-wrap items-center gap-2 text-sm">
                  {[{k:"explore",t:"Explore"},{k:"new",t:"Add Plan"},{k:"log",t:"Log Experience"},{k:"analytics",t:"Analytics"},{k:"mine",t:"My Plans"}].map(x=> (
                    <button key={x.k} onClick={()=>setTab(x.k)} className={`px-3 py-1.5 rounded-xl border ${tab===x.k?"bg-slate-900 text-white border-slate-900":"bg-white hover:bg-slate-100"}`}>{x.t}</button>
                  ))}
                </nav>
              </div>
            </header>

            <main className="max-w-6xl mx-auto px-4 py-6">
              {tab === "explore" && (
                <section className="space-y-4">
                  <div className="rounded-2xl p-4 border bg-white">
                    <div className="grid md:grid-cols-5 gap-3">
                      <input className="px-3 py-2 rounded-xl border" placeholder="Origin (e.g., Reitz)" value={qOrigin} onChange={e=>setQOrigin(e.target.value)} />
                      <input className="px-3 py-2 rounded-xl border" placeholder="Destination (e.g., Shands)" value={qDest} onChange={e=>setQDest(e.target.value)} />
                      <input className="px-3 py-2 rounded-xl border" placeholder="Time window (optional: 08:00-09:00)" value={qTime} onChange={e=>setQTime(e.target.value)} />
                      <div className="flex items-center gap-2 text-sm text-slate-500"><span>{filtered.length} match(es)</span></div>
                      <div className="flex items-center gap-2">
                        <button onClick={doTrain} disabled={training} className="px-3 py-2 rounded-xl border bg-white hover:bg-slate-50 disabled:opacity-50">{training?"Training...":"Train model"}</button>
                        {model && <span className="text-xs text-green-700">model ✔</span>}
                      </div>
                    </div>
                    <p className="text-xs text-slate-500 mt-2">Ranking uses text similarity + rating confidence + wait/crowding/on-time heuristic. If you train the tiny model, its signal is blended in.</p>
                    {modelMsg && <div className="mt-2 text-xs text-slate-600">{modelMsg}</div>}
                  </div>

                  <div className="grid gap-4">
                    {filtered.map(({p}) => (
                      <PlanCard key={p.id} plan={p} ratings={ratings} exps={exps} onRate={(n)=>onRate(p.id, n)} />
                    ))}
                  </div>

                  <div className="rounded-2xl p-4 border bg-white">
                    <div className="font-semibold mb-2">Operational insights (auto)</div>
                    <div className="grid gap-2">
                      {plans.map(p=> <InsightCard key={p.id} plan={p} exps={exps} />)}
                    </div>
                  </div>
                </section>
              )}

              {tab === "new" && (
                <section>
                  <form onSubmit={submitPlan} className="rounded-2xl p-4 border bg-white space-y-4">
                    <div className="grid md:grid-cols-2 gap-3">
                      <input className="px-3 py-2 rounded-xl border" placeholder="Title (e.g., Reitz → Butler fast AM)" value={form.title} onChange={e=>setForm(f=>({...f, title: e.target.value}))} />
                      <input className="px-3 py-2 rounded-xl border" placeholder="Author (email or nickname)" value={form.author} onChange={e=>setForm(f=>({...f, author: e.target.value}))} />
                      <input className="px-3 py-2 rounded-xl border" placeholder="Origin" value={form.origin} onChange={e=>setForm(f=>({...f, origin: e.target.value}))} />
                      <input className="px-3 py-2 rounded-xl border" placeholder="Destination" value={form.destination} onChange={e=>setForm(f=>({...f, destination: e.target.value}))} />
                      <input className="px-3 py-2 rounded-xl border" placeholder="Depart window (HH:MM-HH:MM)" value={form.departWindow} onChange={e=>setForm(f=>({...f, departWindow: e.target.value}))} />
                      <DaysPicker value={form.days} onChange={(days)=>setForm(f=>({...f, days}))} />
                    </div>

                    <div className="space-y-3">
                      <div className="font-medium">Legs</div>
                      {form.legs.map((leg,idx)=> (
                        <div key={idx} className="grid md:grid-cols-4 gap-2">
                          <input className="px-3 py-2 rounded-xl border" placeholder="Route (optional)" value={leg.route} onChange={e=>setForm(f=>({...f, legs: f.legs.map((L,i)=> i===idx?{...L, route: e.target.value}:L)}))} />
                          <input className="px-3 py-2 rounded-xl border" placeholder="From stop/landmark" value={leg.from} onChange={e=>setForm(f=>({...f, legs: f.legs.map((L,i)=> i===idx?{...L, from: e.target.value}:L)}))} />
                          <input className="px-3 py-2 rounded-xl border" placeholder="To stop/landmark" value={leg.to} onChange={e=>setForm(f=>({...f, legs: f.legs.map((L,i)=> i===idx?{...L, to: e.target.value}:L)}))} />
                          <input className="px-3 py-2 rounded-xl border" placeholder="Notes (crowding, tips, etc.)" value={leg.notes} onChange={e=>setForm(f=>({...f, legs: f.legs.map((L,i)=> i===idx?{...L, notes: e.target.value}:L)}))} />
                        </div>
                      ))}
                      <div className="flex gap-2">
                        <button type="button" onClick={handleAddLeg} className="px-3 py-2 rounded-xl border bg-white hover:bg-slate-50">+ Add leg</button>
                        {form.legs.length>1 && (
                          <button type="button" onClick={()=>handleRemoveLeg(form.legs.length-1)} className="px-3 py-2 rounded-xl border bg-white hover:bg-slate-50">− Remove last</button>
                        )}
                      </div>
                    </div>

                    <div className="flex justify-end">
                      <button type="submit" className="px-4 py-2 rounded-xl bg-slate-900 text-white">Publish Plan</button>
                    </div>

                    <p className="text-xs text-slate-500">Note: This demo stores your data in your browser only. In production we would anonymize and store aggregate travel patterns on a secure backend.</p>
                  </form>
                </section>
              )}

              {tab === "log" && (
                <section className="space-y-4">
                  <ExperienceForm plans={plans} onSubmit={onLogExp} />

                  <div className="rounded-2xl p-4 border bg-white">
                    <div className="font-semibold mb-2">Recent experiences</div>
                    <div className="grid gap-2 text-sm">
                      {exps.slice(0,20).map(e=>{
                        const p = plans.find(pp=>pp.id===e.planId);
                        return (
                          <div key={e.id} className="flex flex-wrap items-center gap-3 py-2 border-b last:border-b-0">
                            <div className="font-medium">{p?.title||"(deleted plan)"}</div>
                            <Chip>Wait {e.waitMin}m</Chip>
                            <Chip>Ride {e.onboardMin}m</Chip>
                            <Chip>Crowd {e.crowd}/5</Chip>
                            <Chip>{e.onTime?"On-time":"Late"}</Chip>
                            <Chip>⭐ {e.rating}</Chip>
                            {e.comment && <span className="text-slate-500">· {e.comment}</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </section>
              )}

              {tab === "analytics" && (
                <section className="space-y-4">
                  <div className="rounded-2xl p-4 border bg-white">
                    <div className="flex items-center justify-between gap-2">
                      <div>
                        <div className="font-semibold">Model training</div>
                        <div className="text-sm text-slate-600">Tiny 1-hidden-layer NN on your local experiences → predicts satisfaction (0..1).</div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={doTrain} disabled={training} className="px-3 py-2 rounded-xl border bg-white hover:bg-slate-50 disabled:opacity-50">{training?"Training...":"Train / Retrain"}</button>
                        {model && <span className="text-xs text-green-700">model ✔</span>}
                      </div>
                    </div>
                    {modelMsg && <div className="mt-2 text-xs text-slate-600">{modelMsg}</div>}
                  </div>

                  <div className="rounded-2xl p-4 border bg-white">
                    <div className="font-semibold mb-2">Predicted satisfaction by plan (if model loaded)</div>
                    <div className="grid gap-3">
                      {plans.map(p=>{
                        const f = planFeatures(p, exps);
                        const approx = (1 - f.avgWaitN)*0.5 + f.onTimeN*0.3 + (1 - f.avgCrowdN)*0.2;
                        return (
                          <div key={p.id} className="flex items-center gap-3 text-sm">
                            <div className="w-60 truncate font-medium">{p.title}</div>
                            <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                              <div className="h-full bg-slate-900" style={{width: `${Math.round(100*(model?approx:approx))}%`}}></div>
                            </div>
                            <div className="w-14 text-right">{Math.round(100*(model?approx:approx))}%</div>
                            <div className="text-xs text-slate-500">(heuristic shown; exact model score blended in ranking)</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="rounded-2xl p-4 border bg-white">
                    <div className="font-semibold mb-1">What to add next</div>
                    <ul className="list-disc pl-5 space-y-1 text-sm text-slate-700">
                      <li>Import UF RTS GTFS (routes/stops) to validate legs & auto-suggest stops.</li>
                      <li>Use GTFS-Realtime for live arrivals and crowding signals.</li>
                      <li>Trust model: weigh ratings by rater reputation & recency; detect outliers/brigading.</li>
                      <li>Privacy: anonymize & aggregate usage; opt-in geolocation with differential privacy.</li>
                      <li>Back-end scorer API (Python/FastAPI + PyTorch/TF) for robust training & inference.</li>
                    </ul>
                  </div>
                </section>
              )}

              {tab === "mine" && (
                <section className="space-y-4">
                  <div className="rounded-2xl p-4 border bg-white">
                    <div className="text-sm text-slate-600 mb-2">Showing plans authored by <span className="font-medium">you@ufl.edu</span> (change in the Add Plan form).</div>
                    <div className="grid gap-4">
                      {myPlans.length===0 && <div className="text-slate-500">No plans yet. Create one in <button className="underline" onClick={()=>setTab("new")}>Add Plan</button>.</div>}
                      {myPlans.map(p => (
                        <PlanCard key={p.id} plan={p} ratings={ratings} exps={exps} onRate={(n)=>onRate(p.id, n)} />
                      ))}
                    </div>
                  </div>
                </section>
              )}

              <section className="mt-6 text-sm text-slate-600">
                <div className="rounded-2xl p-4 border bg-white">
                  <div className="font-semibold mb-1">MVP recap</div>
                  <ul className="list-disc pl-5 space-y-1">
                    <li>User-generated route proposals with multi-leg structure</li>
                    <li>Trip experience logging (wait, crowding, on-time, rating)</li>
                    <li>Bayesian smoothing for ratings + heuristic/ML blended ranking</li>
                    <li>Local-first prototype (no backend); model saved to localStorage</li>
                    <li>Auto insights to flag peak mismatch (long wait, low on-time, high crowding)</li>
                  </ul>
                </div>
              </section>
            </main>

            <footer className="py-10 text-center text-xs text-slate-400">MVP • UF Transit Optimizer • v2 (experiences + tiny NN)</footer>
          </div>
        );
      }

      // Mount
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
